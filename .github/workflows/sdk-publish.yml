name: SDK publish

# The SDK's first three versions went to npm by hand from a laptop, and the gap
# that opens had shown up on the registry: `main` carried a ten-contract carrier
# while npm's newest tarball had eight (issue #32). That is the same drift
# executor-image.yml was written to close for the Docker image (issue #15) — the
# artifact users actually install diverging from the source that CI proved green.
# 0.1.0-dev.4 was the first version published by this workflow.
#
# POLICY: `latest` tracks the newest published version, always — a bare
# `npm install` should get current code. Publishes therefore default to `latest`,
# including pre-releases, which is a deliberate departure from the npm convention
# that `latest` means "newest stable". Everything here is a 0.1.0-dev.x today, and
# honouring that convention had left `npm install` resolving to 0.1.0-dev.2, a
# tarball with no deployment carrier in it.
#
# `mode: move-tag` repoints a tag at a version already on the registry — the only
# way to correct a tag after the fact, since a published version cannot be
# re-published.
#
# Authentication is npm **Trusted Publishing** (OIDC): the registry is configured
# with this repository + this workflow *filename* as a trusted publisher, so there
# is no NPM_TOKEN secret to leak or rotate. The entry on npmjs.com, under
# @bytesbrains/maktub-sdk -> Settings -> Trusted Publisher, must read exactly:
#
#   Publisher          GitHub Actions
#   Organization/user  bytesbrains          (the GitHub org, not the npm scope)
#   Repository         maktub
#   Workflow filename  sdk-publish.yml      (basename only — npm adds .github/workflows/)
#   Environment        (empty)              (this job declares no `environment:`)
#   Allowed actions    publish
#
# Consequences worth knowing before you edit this file:
#   - RENAMING THIS FILE BREAKS PUBLISHING until that entry is updated to match.
#   - Adding an `environment:` to this job breaks it too, unless the entry gains
#     the same name.
#   - Provenance attestations are generated automatically under trusted publishing,
#     which is why no --provenance flag appears below. It needs `id-token: write`.
#
# Deliberately NOT part of ci.yml, and deliberately workflow_dispatch-only:
# publishing is irreversible in a way CI never is. A version number can never be
# reused once published, and unpublishing is restricted to a narrow window and
# breaks anyone who already installed. Auto-publishing on merge to main would burn
# a version per merge. Cutting a release stays a deliberate human act — the same
# posture executor-image.yml takes for its version tags.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "publish = build and publish package.json's version. move-tag = only repoint a dist-tag at an already-published version (nothing is built or published)."
        required: true
        default: publish
        type: choice
        options:
          - publish
          - move-tag
      dist_tag:
        description: "Which dist-tag to set. 'latest' is what a bare `npm install` resolves — it should normally track the newest version."
        required: true
        default: latest
        type: choice
        options:
          - latest
          - dev
      move_tag_version:
        description: "move-tag mode only: the already-published version to point the tag at (e.g. 0.1.0-dev.4)."
        required: false
        type: string
      dry_run:
        description: "Run every gate but change nothing on the registry. Leave checked to rehearse."
        required: false
        default: true
        type: boolean

# Never cancel an in-flight publish: a half-completed registry write is worse
# than a slow one. Queue instead.
concurrency:
  group: sdk-publish
  cancel-in-progress: false

jobs:
  publish:
    name: SDK (verify, pack, publish)
    runs-on: ubuntu-latest
    # Fork clones of this repo must never be able to publish under our name, and
    # this workflow only makes sense against the canonical source.
    if: github.repository == 'bytesbrains/maktub'
    permissions:
      contents: read
      # Required for Trusted Publishing — this is what mints the short-lived OIDC
      # token npm exchanges for publish rights. Without it the publish step fails
      # with an authentication error, not a permission one.
      id-token: write
    defaults:
      run:
        working-directory: sdk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Refuse to publish from anywhere but main
        # A dispatch can be aimed at any ref. Publishing from a feature branch would
        # put code on the registry that never passed a merge review — the tarball
        # would be unreproducible from main, which is exactly what provenance is
        # supposed to rule out.
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Refusing to publish from ${GITHUB_REF}. Re-run this workflow against main."
          exit 1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          # NO registry-url — deliberately, and it is not an oversight to "fix".
          #
          # `registry-url` makes setup-node write an .npmrc containing
          #   //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}
          # and export NODE_AUTH_TOKEN as the literal placeholder
          # XXXXX-XXXXX-XXXXX-XXXXX when no token is supplied. npm then sees a
          # configured credential, uses it INSTEAD of attempting the OIDC exchange,
          # and the registry rejects the garbage token with
          #   npm error code E404 ... PUT https://registry.npmjs.org/@bytesbrains%2fmaktub-sdk
          # E404, not E401 — npm reports missing rather than unauthorized so it does
          # not leak which private packages exist, which makes a shadowed credential
          # read like a misconfigured trusted publisher.
          #
          # Omitting it leaves no user .npmrc and NODE_AUTH_TOKEN unset, so npm falls
          # back to its default registry (registry.npmjs.org — the same host) and
          # authenticates via OIDC. Verified on a runner: with registry-url absent,
          # ACTIONS_ID_TOKEN_REQUEST_URL is set and no npmrc is written.
          #
          # Removing it is NECESSARY but was not SUFFICIENT — worth stating plainly,
          # because the bring-up history reads misleadingly otherwise. Publishing
          # failed three times:
          #   E404       (run 30397586602) — registry-url's placeholder token shadowed OIDC
          #   ENEEDAUTH  (runs 30398261989, 30398531344) — credential path clear, but the
          #              trusted-publisher entry on npmjs.com did not match this workflow
          # The npmjs entry was corrected and run 30398802432 published. So both had to
          # be right; fixing either alone still failed, with a different error each time.
          # If publishing breaks again, check BOTH, and read the ENEEDAUTH signature as
          # "npm never attempted the exchange" — npm logs nothing at all in that case.
          cache: "npm"
          cache-dependency-path: sdk/package-lock.json

      - name: Ensure npm supports Trusted Publishing
        # The npm bundled with Node 22 is 10.x, which predates OIDC publishing
        # entirely and would fall back to looking for a token that does not exist.
        # 11.5.1 is the floor; pulling latest keeps us above it.
        working-directory: .
        run: |
          npm install -g npm@latest
          npm --version

      - name: Install dependencies
        # move-tag builds nothing, so it needs no node_modules.
        if: inputs.mode == 'publish'
        run: npm ci

      - name: OIDC must be available and unshadowed
        # Turns the two ways trusted publishing silently breaks into named failures
        # instead of npm's E404, which reads like a misconfigured publisher and sends
        # you looking in the wrong place (it cost a failed publish once already).
        #
        #   1. No OIDC token endpoint -> `id-token: write` was dropped or the repo is
        #      barred from OIDC. Note that GitHub does NOT list Id-token in the
        #      "GITHUB_TOKEN Permissions" log group even when it is granted, so that
        #      group is not a way to check this. The env var is.
        #   2. A configured _authToken -> npm prefers it and never tries OIDC, so a
        #      stray registry-url or NODE_AUTH_TOKEN silently disables the whole
        #      mechanism.
        #
        # This gate cannot see the third failure mode, since it lives on npmjs.com and
        # not on the runner: a trusted-publisher entry that does not match this
        # repository + workflow filename. That one surfaces later as ENEEDAUTH from
        # `npm publish`, with no preceding log line, because npm does not attempt the
        # exchange at all. Green here means the runner side is sound — nothing more.
        working-directory: .
        run: |
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "::error::No OIDC token endpoint. The job needs 'id-token: write' and the repo must be allowed to request OIDC tokens."
            exit 1
          fi
          echo "OIDC token endpoint is available."

          if [ -n "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error::NODE_AUTH_TOKEN is set. npm would use it instead of OIDC and fail with a misleading E404. Remove it (usually setup-node's 'registry-url')."
            exit 1
          fi

          for f in "${NPM_CONFIG_USERCONFIG:-}" "$HOME/.npmrc" "$GITHUB_WORKSPACE/sdk/.npmrc" "$GITHUB_WORKSPACE/.npmrc"; do
            [ -n "$f" ] && [ -f "$f" ] || continue
            if grep -q "_authToken" "$f"; then
              echo "::error::$f configures an _authToken, which shadows OIDC. Remove it (usually setup-node's 'registry-url')."
              exit 1
            fi
          done
          echo "No _authToken configured — npm will authenticate via OIDC."

      # ---- Everything below this line must pass before anything is published. ----

      - name: Verify (typecheck, build, tests)
        if: inputs.mode == 'publish'
        # ci.yml already ran these on the merge commit, but re-running them here is
        # the point: this job publishes the tree it just built, so the artifact that
        # reaches the registry is the artifact that was proven green — not one that
        # merely shares a commit with a green run. `build` also runs copy:wasm and
        # copy:vectors, which produce files the tarball needs.
        run: |
          npm run typecheck
          npm run build
          npm test

      - name: Version must not already be on the registry
        if: inputs.mode == 'publish'
        # npm rejects a duplicate version anyway, but it does so *after* the publish
        # request — a confusing 403 that reads like an auth failure. Fail here
        # instead, with the actual reason and the fix.
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          echo "Publishing candidate: ${name}@${version}"
          if npm view "${name}@${version}" version >/dev/null 2>&1; then
            echo "::error file=sdk/package.json::${name}@${version} is already published. Bump the version in sdk/package.json and add a CHANGELOG entry."
            exit 1
          fi
          echo "${name}@${version} is not yet on the registry."
          {
            echo "name=${name}"
            echo "version=${version}"
          } >> "$GITHUB_OUTPUT"
        id: meta

      - name: Note the dist-tag being used
        if: inputs.mode == 'publish'
        # This used to REFUSE to publish a pre-release to `latest`, on the usual npm
        # convention that `latest` should mean "newest stable". That guard is gone by
        # an explicit decision: for this project `latest` must always point at the
        # newest published version, so a bare `npm install` gets current code. Every
        # version is a 0.1.0-dev.x pre-release today, and blocking them from `latest`
        # left `npm install` resolving to 0.1.0-dev.2 — a tarball with no deployment
        # carrier at all. Being technically correct about the tag was worse for
        # consumers than the convention it protected.
        #
        # Recorded so nobody "restores" the guard as a fix: it is informational now.
        env:
          DIST_TAG: ${{ inputs.dist_tag }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          case "$VERSION" in
            *-*) note="pre-release" ;;
            *)   note="stable" ;;
          esac
          echo "Version ${VERSION} (${note}) → dist-tag '${DIST_TAG}'."
          if [ "$DIST_TAG" = "latest" ]; then
            echo "::notice::After this publish, a bare 'npm install' resolves to ${VERSION}."
          fi

      - name: Tarball must carry the deployment carrier and the vectors
        if: inputs.mode == 'publish'
        # Regression gate for issue #32. Both files are *generated into* the package
        # (the carrier by scripts/gen-addresses.mjs, the vectors by copy:vectors from
        # the repo-root source of truth), so a build-script or package.json#files
        # change can silently drop them without failing a single unit test.
        #
        # The carrier is the addresses every non-TypeScript downstream reads. If it
        # ships short, consumers hardcode what is missing, outside the drift check —
        # and because a recipient's reading key is published against a derived
        # smart-wallet address, a stale factory address is an account-level fault,
        # not a display one. The vectors are the byte-for-byte cross-language
        # contract every port asserts against.
        run: |
          npm pack --silent >/dev/null
          tarball=$(ls -t ./*.tgz | head -1)
          echo "Inspecting ${tarball}"

          for required in package/deployments/base-sepolia.json package/vectors/reading-key.json; do
            if ! tar tzf "$tarball" | grep -qxF "$required"; then
              echo "::error file=sdk/package.json::${required} is missing from the tarball. Check package.json#files and the build scripts."
              tar tzf "$tarball" | head -40
              exit 1
            fi
            echo "  present: ${required}"
          done

          # The carrier must be complete, not merely present — eight contracts was
          # the exact shape of issue #32.
          count=$(tar xzOf "$tarball" package/deployments/base-sepolia.json | node -p "Object.keys(JSON.parse(require('fs').readFileSync(0,'utf8')).contracts).length")
          echo "  carrier contracts: ${count}"
          if [ "$count" -lt 10 ]; then
            echo "::error::Carrier ships ${count} contracts, expected at least 10. Add the missing entries to the allow-list in scripts/gen-addresses.mjs (issue #32)."
            tar xzOf "$tarball" package/deployments/base-sepolia.json
            exit 1
          fi

          # The packaged vectors must match the repo-root source of truth exactly —
          # a stale copy is worse than none, since ports would assert against it.
          tar xzOf "$tarball" package/vectors/reading-key.json > /tmp/packed-vectors.json
          if ! diff -q /tmp/packed-vectors.json ../vectors/reading-key.json >/dev/null; then
            echo "::error::Packaged vectors differ from vectors/reading-key.json. Re-run the build."
            diff /tmp/packed-vectors.json ../vectors/reading-key.json || true
            exit 1
          fi
          echo "  packaged vectors are byte-identical to vectors/reading-key.json"

          rm -f "$tarball"

      - name: Publish (dry run)
        if: inputs.mode == 'publish' && inputs.dry_run
        env:
          DIST_TAG: ${{ inputs.dist_tag }}
        run: |
          npm publish --dry-run --tag "$DIST_TAG" --access public
          echo "::notice::DRY RUN — nothing was published. Re-run with 'dry_run' unchecked to publish for real."

      - name: Publish
        if: ${{ inputs.mode == 'publish' && !inputs.dry_run }}
        # No NODE_AUTH_TOKEN, and no .npmrc — see the setup-node comment above.
        # Authentication is the OIDC token minted by the `id-token: write` permission
        # and exchanged with the registry, which also produces the provenance
        # attestation automatically. `--access public` is required because the package
        # is scoped and scoped packages default to restricted on first publish.
        env:
          DIST_TAG: ${{ inputs.dist_tag }}
        run: npm publish --tag "$DIST_TAG" --access public

      # ---- move-tag mode: repoint a dist-tag at a version already on the registry ----
      #
      # Needed because a published version cannot be re-published, so `npm publish`
      # can never fix a dist-tag after the fact. It is also the only CI route to make
      # `latest` track the newest version when the newest version is already out.
      #
      # UNPROVEN AT TIME OF WRITING: npm's Trusted Publishing was designed around
      # `npm publish`, and whether the OIDC exchange also authorises `npm dist-tag`
      # is not something the docs settle. If this fails with ENEEDAUTH, the exchange
      # does not cover it, and moving a tag stays a local `npm dist-tag add` run by a
      # maintainer with 2FA. The npmjs trusted-publisher entry may also need a
      # dist-tag action ticked under "Allowed actions".

      - name: Resolve and validate the target version
        if: inputs.mode == 'move-tag'
        id: retag
        env:
          TARGET: ${{ inputs.move_tag_version }}
        run: |
          name=$(node -p "require('./package.json').name")
          if [ -z "${TARGET:-}" ]; then
            echo "::error::move-tag mode needs 'move_tag_version' (e.g. 0.1.0-dev.4)."
            exit 1
          fi
          # Inverse of the publish-mode guard: here the version MUST already exist.
          # Pointing a tag at a nonexistent version would leave `npm install` broken.
          if ! npm view "${name}@${TARGET}" version >/dev/null 2>&1; then
            echo "::error::${name}@${TARGET} is not published. A dist-tag can only point at an existing version."
            exit 1
          fi
          echo "${name}@${TARGET} exists and can be tagged."
          {
            echo "name=${name}"
            echo "version=${TARGET}"
          } >> "$GITHUB_OUTPUT"

      - name: Move dist-tag (dry run)
        if: inputs.mode == 'move-tag' && inputs.dry_run
        env:
          NAME: ${{ steps.retag.outputs.name }}
          VERSION: ${{ steps.retag.outputs.version }}
          DIST_TAG: ${{ inputs.dist_tag }}
        run: |
          echo "Would run: npm dist-tag add ${NAME}@${VERSION} ${DIST_TAG}"
          echo "Current tags:"
          npm view "$NAME" dist-tags
          echo "::notice::DRY RUN — no tag was moved. Note this does NOT test authentication; only a real run does."

      - name: Move dist-tag
        if: ${{ inputs.mode == 'move-tag' && !inputs.dry_run }}
        env:
          NAME: ${{ steps.retag.outputs.name }}
          VERSION: ${{ steps.retag.outputs.version }}
          DIST_TAG: ${{ inputs.dist_tag }}
        run: |
          npm dist-tag add "${NAME}@${VERSION}" "$DIST_TAG"
          echo "Tags now:"
          npm view "$NAME" dist-tags

      - name: Summary
        if: success()
        env:
          NAME: ${{ steps.meta.outputs.name || steps.retag.outputs.name }}
          VERSION: ${{ steps.meta.outputs.version || steps.retag.outputs.version }}
          MODE: ${{ inputs.mode }}
          DIST_TAG: ${{ inputs.dist_tag }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          {
            echo "### SDK ${MODE}"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Package | \`${NAME}\` |"
            echo "| Version | \`${VERSION}\` |"
            echo "| Mode | \`${MODE}\` |"
            echo "| dist-tag | \`${DIST_TAG}\` |"
            echo "| Dry run | \`${DRY_RUN}\` |"
            echo
            if [ "$DRY_RUN" = "true" ]; then
              echo "Nothing changed on the registry."
            elif [ "$MODE" = "move-tag" ]; then
              echo "\`${DIST_TAG}\` now points at \`${VERSION}\`. Verify with \`npm view ${NAME} dist-tags\`."
            else
              echo "Published. Verify with \`npm view ${NAME} dist-tags\`."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
